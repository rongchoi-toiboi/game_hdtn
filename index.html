<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprouts Online Multiplayer</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--desk:#e2e9ee;--paper:#fbfdfe;--grid:#dde8ee;--ink:#1c2b36;--mut:#5d6f7b;--p1:#d6336c;--p2:#1c7ed6;--card:#fff;--line:#c9d6de;--sh:0 1px 2px rgba(28,43,54,.06),0 8px 24px rgba(28,43,54,.08);--f:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media all{:root[data-theme=dark]{color-scheme:dark;--desk:#0d161d;--paper:#14232e;--grid:#1d3240;--ink:#e8f0f5;--mut:#8ea2af;--p1:#ff6b9a;--p2:#5fb0ff;--card:#182934;--line:#27414f;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;padding:clamp(12px,3vw,32px);background:var(--desk);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
h1{font:700 1.75rem/1 var(--f);margin:0;letter-spacing:-.03em}
header p{margin:0;color:var(--mut);font-size:.9rem}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.pl i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.pl input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-weight:700}
.pl em{font-style:normal;font-size:.75rem;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--c);color:var(--paper);white-space:nowrap}
#st{min-height:1.5em}
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:8px}
canvas{display:block;width:100%;aspect-ratio:3/2;touch-action:none;border-radius:10px;background:var(--paper);cursor:grab}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
select,input[type=number],button{font:inherit;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lob{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.match-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper);padding:12px;border-radius:10px;border:1px solid var(--line)}
.match-bar input[type=text]{padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;width:16ch}
.btn-auto{background:#16a34a;color:#fff;font-weight:700;border:none;padding:10px 18px;border-radius:8px;cursor:pointer}
.btn-auto.btn-cancel-search{background:#dc2626}
#qm{font-weight:600;color:var(--p2);min-height:1.2em}
.lb-table{width:100%;border-collapse:collapse}
.lb-table th,.lb-table td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
.lb-table th{color:var(--mut);font-size:.8rem;text-transform:uppercase}
.lb-table tr.me{background:color-mix(in srgb,var(--p2) 12%,transparent);font-weight:700}
/* Quiz Modal */
#quizModal{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#quizModal[hidden]{display:none}
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:560px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:16px}
.quiz-card h2{margin:0;font-size:1.4rem;color:var(--ink)}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-opt-btn{text-align:left;padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600;transition:all .2s}
.quiz-opt-btn:hover:not(:disabled){border-color:var(--p2);background:color-mix(in srgb,var(--p2) 8%,transparent)}
.quiz-opt-btn.correct{background:#16a34a;color:#fff;border-color:#16a34a}
.quiz-opt-btn.incorrect{background:#dc2626;color:#fff;border-color:#dc2626}
</style></head><body data-ph="lobby"><main>
<header><h1>Sprouts Online</h1><p>Phiên bản nâng cấp Multiplayer Real-time tích hợp trắc nghiệm Elo</p><span class="sp"></span><button id="mu"></button><button id="th"></button></header>
<section class="players">
<div class="pl" id="c0" style="--c:var(--p1)"><i></i><input id="p0" maxlength="16" value="Player 1" readonly><em id="t0" hidden></em><span class="elo" id="e0" hidden></span></div>
<div class="pl" id="c1" style="--c:var(--p2)"><i></i><input id="p1" maxlength="16" value="Player 2" readonly><em id="t1" hidden></em><span class="elo" id="e1" hidden></span></div>
</section>
<div id="st" role="status"></div>
<section class="lob" id="lobby"><h2>Lobby & Tìm trận nhanh</h2>
<div class="match-bar"><label for="pName"><b>Tên của bạn:</b></label><input type="text" id="pName" maxlength="16" autocomplete="off" placeholder="Tên hiển thị"><button id="qb" class="btn-auto">⚡ Tìm trận nhanh</button><span id="sv"></span><span class="sp"></span><span>Elo: <b id="myElo">500</b></span></div>
<p id="qm" role="status"></p>
<div class="lrow"><label>Số lượng Node (Spots): <select id="n"><option value="4" selected>4 Node</option><option value="5">5 Node</option><option value="6">6 Node</option></select></label></div>
</section>
<section class="lob" id="lb"><h2>🏆 Bảng xếp hạng Elo (Top 10)</h2>
<table class="lb-table"><thead><tr><th>#</th><th>Tên người chơi</th><th>Điểm Elo</th><th>Số ván</th></tr></thead><tbody id="lbBody"><tr><td colspan="4">Đang tải dữ liệu...</td></tr></tbody></table></section>
<div class="sheet" id="sheet"><canvas id="c"></canvas><div id="bn" hidden></div></div>
<div class="bar">
<span class="sp"></span><button id="un">Undo</button><button id="nw" class="pri">New game</button>
</div>
</main>

<!-- Quiz Modal -->
<div id="quizModal" hidden>
  <div class="quiz-card">
    <h2 id="qTitle">THỬ THÁCH KIẾN THỨC</h2>
    <p id="qResultBanner" style="font-weight:700;margin:0;color:var(--p2);"></p>
    <div style="font-size:0.9rem;font-weight:600;color:var(--mut);" id="qProgress">Câu 1/3</div>
    <p id="qContent" style="font-weight:600;margin:0;"></p>
    <div class="quiz-options" id="qOptions">
      <button class="quiz-opt-btn" data-key="A"></button>
      <button class="quiz-opt-btn" data-key="B"></button>
      <button class="quiz-opt-btn" data-key="C"></button>
      <button class="quiz-opt-btn" data-key="D"></button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const socket=typeof io!=='undefined'?io({transports:['websocket','polling']}):null;
const W=900,H=600,R=11,D=2;cv.width=W*D;cv.height=H*D;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),pc=p=>css(p?'--p2':'--p1');
let spots=[],lines=[],turn,over,hist,cur,go=false,lim=0,seat=-1,run=false,fc=0,pan=null,pv=null,cam={x:0,y:0,z:1};
let names=['Player 1','Player 2'],ph='lobby',searching=false,myPub='',lbData=[];
let currentQuizSession=null;

const pid=(()=>{let v='';try{v=localStorage.getItem('sp-pid')||''}catch(e){}
  if(!/^[A-Za-z0-9_-]{8,64}$/.test(v)){v=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');try{localStorage.setItem('sp-pid',v)}catch(e){}}
  return v})();
{let n='';try{n=localStorage.getItem('sp-name')||''}catch(e){}$('pName').value=n||'Player'+(100+Math.floor(Math.random()*900))}
const myName=()=>($('pName').value.trim()||'Player').slice(0,16);

$('pName').onchange=()=>{
  const name=myName();
  try{localStorage.setItem('sp-name',name)}catch(e){}
  if(socket&&socket.connected)socket.emit('set_name',{pid,name});
};

$('qb').onclick=()=>{
  if(!socket||!socket.connected)return;
  const nodes=parseInt($('n').value,10);
  if(![4,5,6].includes(nodes)){alert('Số lượng Node không hợp lệ!');return;}
  if(!searching){
    searching=true;
    $('qm').textContent='🔍 Đang tìm trận...';
    socket.emit('find_match',{pid,name:myName(),nodes});
  }else{
    searching=false;
    $('qm').textContent='';
    socket.emit('cancel_match');
  }
  updateLobbyUI();
};

function updateLobbyUI(){
  $('qb').textContent=searching?'❌ Hủy tìm trận':'⚡ Tìm trận nhanh';
  $('qb').classList.toggle('btn-cancel-search',searching);
  $('pName').disabled=searching;
  $('n').disabled=searching;
}

function renderLb(){
  const tb=$('lbBody');tb.replaceChildren();
  if(!lbData.length){const td=tb.insertRow().insertCell();td.colSpan=4;td.textContent='Chưa có dữ liệu';return}
  lbData.forEach((u,i)=>{const tr=tb.insertRow();if(u.pub&&u.pub===myPub)tr.className='me';
    [i+1,(u.online?'🟢 ':'')+u.name,u.elo,u.games].forEach((v,k)=>{const td=tr.insertCell();td.textContent=v;if(k==2)td.style.fontWeight='700'})});
}

// Socket events
if(socket){
  socket.on('connect',()=>{socket.emit('set_name',{pid,name:myName()});$('sv').textContent='🟢 Đã kết nối';});
  socket.on('disconnect',()=>{$('sv').textContent='🔴 Mất kết nối';});
  socket.on('profile',p=>{myPub=p.pub;$('myElo').textContent=p.elo;renderLb()});
  socket.on('name_result',res=>{if(!res.success)alert(res.message);});
  socket.on('leaderboard_update',d=>{lbData=Array.isArray(d)?d:[];renderLb()});
  socket.on('match_start',d=>{
    searching=false;$('qm').textContent='';
    updateLobbyUI();
    document.body.dataset.ph='play';
    seat=d.role;
    names[0]=d.p1Name;names[1]=d.p2Name;
    $('p0').value=names[0];$('p1').value=names[1];
    spots=d.spots;lines=[];turn=d.turn;over=false;go=true;
    [0,1].forEach(i=>{$('e'+i).textContent='Elo '+d.elo[i];$('e'+i).hidden=false});
    draw();
  });
  socket.on('elo_result',r=>{
    if(r.void){alert('Kết quả hòa hoặc lỗi, không tính Elo.');return;}
  });

  // Quiz listeners
  socket.on('quiz_start',d=>{
    currentQuizSession=d;
    $('quizModal').hidden=false;
    $('qResultBanner').textContent=`TRẬN ĐẤU KẾT THÚC: ${d.resultType.toUpperCase()}`;
    loadQuizQuestion(d.currentQuestion);
  });

  socket.on('quiz_answer_result',d=>{
    const btns=document.querySelectorAll('.quiz-opt-btn');
    btns.forEach(b=>b.disabled=false);
    if(d.nextQuestion){
      loadQuizQuestion(d.nextQuestion);
    }
  });

  socket.on('quiz_completed',d=>{
    setTimeout(()=>{
      $('quizModal').hidden=true;
      alert(`Hoàn thành thử thách! Trả lời đúng: ${d.correctCount}/3. Thay đổi Elo: ${d.finalEloDelta>=0?'+':''}${d.finalEloDelta}`);
      document.body.dataset.ph='lobby';
    },1000);
  });
}

function loadQuizQuestion(q){
  $('qProgress').textContent=`Câu ${q.index}/3`;
  $('qContent').textContent=q.question;
  const optKeys=['A','B','C','D'];
  optKeys.forEach(k=>{
    const btn=$(`qOptions`).querySelector(`[data-key="${k}"]`);
    btn.textContent=`${k}. ${q.options[k]||''}`;
    btn.onclick=()=>{
      const btns=document.querySelectorAll('.quiz-opt-btn');
      btns.forEach(b=>b.disabled=true);
      socket.emit('submit_quiz_answer',{sessionId:currentQuizSession.sessionId,selectedAnswer:k});
    };
  });
}

function draw(){
  g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);
  g.setTransform(D*cam.z,0,0,D*cam.z,D*(W/2-cam.x*cam.z),D*(H/2-cam.y*cam.z));
  g.lineCap=g.lineJoin='round';
  spots.forEach(s=>{
    g.beginPath();g.arc(s.x,s.y,R,0,7);g.fillStyle=css('--paper');g.fill();
    g.lineWidth=2.5;g.strokeStyle=css('--ink');g.stroke();
  });
}

$('th').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';
</script></body></html>
